<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CS302JSC JavaScript Lab 01 - Getting Started with JavaScript by Amritansh Gupta"
    />
    <title>CS302JSC – Lab 01 | Amritansh Gupta</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Fira+Code:wght@400;500&display=swap");

      :root {
        --bg: #0f0f1a;
        --card: #1a1a2e;
        --border: #2a2a4a;
        --accent: #7c3aed;
        --accent2: #06b6d4;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --green: #10b981;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        max-width: 680px;
        width: 100%;
        animation: fadeIn 0.6s ease;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0);    }
      }

      /* ── Badge ── */
      .badge {
        display: inline-block;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.35rem 0.9rem;
        border-radius: 999px;
        margin-bottom: 1.2rem;
      }

      /* ── Heading ── */
      h1 {
        font-size: 2.2rem;
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 0.4rem;
        background: linear-gradient(135deg, #c4b5fd, var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }

      /* ── Card ── */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem;
        display: grid;
        gap: 1rem;
        transition: box-shadow 0.3s;
      }

      .card:hover {
        box-shadow: 0 0 40px rgba(124, 58, 237, 0.15);
      }

      /* ── Row ── */
      .row {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 10px;
        transition: background 0.25s, transform 0.25s;
      }

      .row:hover {
        background: rgba(124, 58, 237, 0.08);
        transform: translateX(4px);
      }

      .row-icon {
        font-size: 1.3rem;
        width: 2.2rem;
        text-align: center;
        flex-shrink: 0;
      }

      .row-label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        min-width: 110px;
      }

      .row-value {
        font-weight: 600;
        font-size: 1rem;
        font-family: "Fira Code", monospace;
        color: var(--accent2);
      }

      /* ── Footer ── */
      .footer {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        margin-right: 6px;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1);   }
        50%       { opacity: 0.5; transform: scale(1.4); }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <span class="badge">CS302JSC · Lab Assignment 01</span>

      <h1>Welcome to JavaScript Lab</h1>
      <p class="subtitle">Department of Computer Science &mdash; DSVV</p>

      <section class="card" id="student-info" aria-label="Student Information">
        <div class="row" id="row-name">
          <span class="row-icon">👤</span>
          <span class="row-label">Name</span>
          <span class="row-value">Amritansh Gupta</span>
        </div>

        <div class="row" id="row-scholar">
          <span class="row-icon">🎓</span>
          <span class="row-label">Scholar No.</span>
          <span class="row-value">2424219</span>
        </div>

        <div class="row" id="row-course">
          <span class="row-icon">📚</span>
          <span class="row-label">Course</span>
          <span class="row-value">BCA</span>
        </div>

        <div class="row" id="row-semester">
          <span class="row-icon">📅</span>
          <span class="row-label">Semester</span>
          <span class="row-value">V (5th)</span>
        </div>

        <div class="row" id="row-college">
          <span class="row-icon">🏛️</span>
          <span class="row-label">College</span>
          <span class="row-value">DSVV</span>
        </div>
      </section>

      <p class="footer">
        <span class="dot"></span>
        script.js is active — open the Console (F12) to see output
      </p>
    </main>

    <!-- External JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
